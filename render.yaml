# Render Blueprint — ใช้ตอนสร้างผ่าน New → Blueprint (หรือจะสร้าง Web Service เองตาม README ก็ได้)
services:
  - type: web
    name: kantang-timeclock
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SUPABASE_URL
        sync: false        # กรอกเองตอนสร้าง
      - key: SUPABASE_KEY
        sync: false        # กรอกเองตอนสร้าง (ความลับ)
      - key: PIN_SALT
        generateValue: true  # Render สุ่มให้อัตโนมัติ — ห้ามเปลี่ยนหลังเริ่มใช้งาน
      - key: INIT_ADMIN
        sync: false        # ครั้งแรก: "รหัส:PIN" ของแอดมินคนแรก แล้วลบทิ้งหลังเข้าระบบได้
